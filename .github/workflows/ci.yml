name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stellarlens
          POSTGRES_PASSWORD: stellarlens
          POSTGRES_DB: stellarlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellarlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test
        env:
          DATABASE_URL: postgres://stellarlens:stellarlens@localhost:5432/stellarlens
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK: testnet

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stellarlens
          POSTGRES_PASSWORD: stellarlens
          POSTGRES_DB: stellarlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellarlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://stellarlens:stellarlens@localhost:5432/stellarlens
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK: testnet
      SEED_ADMIN_EMAIL: admin@stellarlens.local
      SEED_ADMIN_PASSWORD: e2e-admin-password-1
      SESSION_SECRET: e2e-session-secret-at-least-16-bytes
      API_URL: http://localhost:3400
      PORT: 3400

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @stellarlens/db build

      - run: pnpm --filter @stellarlens/api build

      - run: pnpm --filter @stellarlens/web build

      - run: pnpm --filter @stellarlens/db db:migrate

      - run: pnpm --filter @stellarlens/web seed-admin

      - name: Seed a full-scope api key for the web app to proxy with
        id: seed-api-key
        working-directory: apps/web
        run: echo "key=$(pnpm --silent seed-api-key)" >> "$GITHUB_OUTPUT"

      - name: Start the api
        working-directory: apps/api
        run: |
          node dist/main.js > api.log 2>&1 &
          npx wait-on -t 30000 http://localhost:3400/health

      - name: Start the web app
        working-directory: apps/web
        env:
          API_KEY: ${{ steps.seed-api-key.outputs.key }}
        run: |
          npx next start -p 3100 > web.log 2>&1 &
          npx wait-on -t 30000 http://localhost:3100/login

      - run: pnpm --filter @stellarlens/web exec playwright install --with-deps chromium

      - run: pnpm --filter @stellarlens/web test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - if: failure()
        run: |
          echo "--- api.log ---"; cat apps/api/api.log || true
          echo "--- web.log ---"; cat apps/web/web.log || true
